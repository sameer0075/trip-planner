# Render Blueprint for the API (https://render.com/docs/blueprint-spec).
services:
  - type: web
    name: eld-trip-planner-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false # e.g. https://your-app.vercel.app
      - key: CORS_ALLOWED_ORIGIN_REGEXES
        sync: false # e.g. ^https://your-app-.*\.vercel\.app$ for preview deployments
      - key: NUM_PROXIES
        value: "1"
